<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>தமிழ்</title><style>
body{margin:0;font-family:Arial;background:#0b1020;color:white}nav{padding:22px 8%;background:#111831}.logo{font-size:25px;font-weight:bold;color:#7dd3fc}.hero{padding:100px 8%;background:linear-gradient(135deg,#111831,#172554,#0f766e)}h1{font-size:60px;max-width:700px}.hero p{font-size:20px;color:#dbeafe;max-width:650px}.btn{padding:14px 24px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}#result{margin-top:20px;padding:18px;background:#ffffff18;border-radius:12px;max-width:600px}section{padding:70px 8%}.cards{display:flex;gap:20px;flex-wrap:wrap}.card{background:#151d38;padding:25px;border-radius:16px;flex:1;min-width:200px}footer{text-align:center;padding:25px;background:#080d1a;color:#9aa8c0}
</style></head><body>
<nav><div class="logo">✦ தமிழ்</div></nav>
<header class="hero"><h1>அகர முதல எழுத்தெல்லாம் ஆதி<br>பகவன் முதற்றே உலகு.</h1><p>Discover ideas, learn skills and find inspiration.</p><a class="btn" href="#explore">Explore</a></header>
<section><h2>What you can discover</h2><div class="cards"><div class="card">🏛️ தமிழர் வரலாறு</div><div class="card">🪘 தமிழர் பாரம்பரிய கலைகள் </div><div class="card">🌾 தமிழர் பாரம்பரிய வாழ்க்கை</div></div></section>
<section id="explore"><h2>Ready to explore?</h2><button class="btn" onclick="startExploring()">Start Exploring</button><div id="result"></div></section>
<footer>© 2026 தமிழ்</footer>
<script>
async function startExploring(){const r=document.getElementById('result');r.textContent='Finding something for you...';try{const x=await fetch('/api/explore');const d=await x.json();r.innerHTML='<b>'+d.title+'</b><br>'+d.message}catch(e){r.textContent='Backend is not running.'}}
</script></body></html>
